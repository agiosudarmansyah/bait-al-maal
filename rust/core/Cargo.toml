[package]
name = "core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
anyhow = "1.0"
mockall = "0.15"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "sqlite",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate"
] }
tokio = { version = "1", features = ["full"] }
